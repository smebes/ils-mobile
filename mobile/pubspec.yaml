name: sprachapp
description: "SprachApp — A1 Almanca öğrenme uygulaması"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  audioplayers: ^6.1.0
  shared_preferences: ^2.3.2
  confetti: ^0.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/content/l3/
    - assets/vocab/
    - assets/img/
    - assets/audio/l3/slow/
    - assets/audio/l3/normal/
